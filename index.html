<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0f14">
  <title>Robot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="conn" data-state="disconnected">
      <span class="dot"></span>
      <span id="conn-label">Déconnecté</span>
    </div>
    <button id="btn-connect" class="small">Connecter le robot</button>
  </header>

  <section class="robot">
    <div class="label">Mode du robot</div>
    <div id="robot-mode" data-mode="">–</div>
    <div id="stats" class="muted">–</div>
  </section>

  <section class="modes">
    <button id="btn-random" class="mode">Aléatoire</button>
    <button id="btn-mimic" class="mode">Mimétisme</button>
  </section>

  <section id="camera">
    <div class="frame">
      <video id="vid" playsinline muted></video>
      <canvas id="mesh"></canvas>
    </div>
    <div class="row">
      <span id="face-state" class="muted">Caméra éteinte</span>
      <span id="fps" class="muted">–</span>
    </div>
    <div class="row values">
      <span>Tangage <b id="val-pitch">0</b>°</span>
      <span>Roulis <b id="val-roll">0</b>°</span>
      <span>Rotation <b id="val-yaw">0</b>°</span>
    </div>
    <div class="expr">
      <span>Expression : <b id="expr-label">Neutre</b></span>
      <div class="bar"><div id="expr-bar" data-expr="0"></div></div>
    </div>
    <div class="row">
      <button id="btn-calibrate" class="small">Recentrer</button>
      <button id="btn-mesh" class="small">Mesh seul</button>
    </div>
  </section>

  <details class="settings">
    <summary>Réglages</summary>
    <label>Gain tangage <output id="gainPitch-val">1.0</output>
      <input id="gainPitch" type="range" min="0" max="3" step="0.1"></label>
    <label>Gain roulis <output id="gainRoll-val">1.0</output>
      <input id="gainRoll" type="range" min="0" max="3" step="0.1"></label>
    <label>Gain rotation <output id="gainYaw-val">1.0</output>
      <input id="gainYaw" type="range" min="0" max="3" step="0.1"></label>
    <label class="check"><input id="invertPitch" type="checkbox"> Inverser le tangage</label>
    <label class="check"><input id="invertRoll" type="checkbox"> Inverser le roulis</label>
    <label class="check"><input id="invertYaw" type="checkbox"> Inverser la rotation</label>
    <label class="check"><input id="pumpsEnabled" type="checkbox"> Pompes réagissent aux expressions</label>
  </details>

  <button id="btn-stop">STOP</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
